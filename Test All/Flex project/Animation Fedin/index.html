<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <section class="animation">
      <h1>Animation</h1>
      <div class="grid">
        <div class="card Fade-In"></div>
        <div class="card slide-left"></div>
        <div class="card bounce"></div>
        <div class="card rotate"></div>
        <div class="card pulse"></div>
        <div class="card glow"></div>
      </div>
    </section>
    <section class="transformation">
      <h1>Transformation</h1>
      <div class="grid">
        <div class="card transform t-translate"></div>
        <div class="card transform t-scale"></div>
        <div class="card transform t-rotate"></div>
        <div class="card transform t-skew"></div>
        <div class="card transform t-flip">
          <div class="card t-inner-flip"></div>
        </div>
      </div>
    </section>
  </body>
</html>
