<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskjs1.2</title>
    <style>
        .dark-mode {
            background-color: darkblue;
            color: beige;
        }

        .header-mode {
            text-align: center;
            background-color: skyblue;
            color: white;
        }

        .navbar-mode {
           
            background-color: skyblue;
            color: white;
        }

        .footer-mode {
            text-align: center;
            background-color: skyblue;
            color: white;
        }

        .sidebar-mode {
            background-color: purple;
            color: pink;
        }

        .card-mode {
            background-color: green;
            color: orange;
        }
    </style>
</head>

<body id="body">

    <button id="themeBtn" onclick="changeTheme()">Change Theme</button>

    <header id="header">
        <h1>My Website</h1>
    </header>
    <div class="container">
        <nav id="navbar" style="display: flex;justify-content: center; ">

            <ul class="nav-links" style="display: flex; justify-content: center; gap: 20px;">

                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>

            </ul>

        </nav>

        <div id="sidebar">

            <h2>Sidebar</h2>
            <p>This is the sidebar content.</p>

        </div>
        <main>
            <div id="card">
                <h3>Card 1</h3>
                <p>Card content goes here.</p>



                <h3>Card 2</h3>
                <p>Card content goes here.</p>



                <h3>Card 3</h3>
                <p>Card content goes here.</p>
            </div>
        </main>
        <hr />
        <footer id="footer">
            <p>&copy; 2026 My Website</p>
        </footer>

        <script>
            function changeTheme() {
                document.getElementById('body').classList.toggle('dark-mode');
                document.getElementById('header').classList.toggle('header-mode');
                document.getElementById('navbar').classList.toggle('navbar-mode');
                document.getElementById('footer').classList.toggle('footer-mode');
                document.getElementById('sidebar').classList.toggle('sidebar-mode');
                document.getElementById('card').classList.toggle('card-mode');
            }
        </script>

</body>

</html>
